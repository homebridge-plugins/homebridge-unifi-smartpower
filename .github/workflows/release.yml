name: Release

# Publishes the plugin to npm when a GitHub release is published.
#
# The `latest` branch only accepts changes through a pull request, so the
# version bump and CHANGELOG entry land in a normal PR. Publishing a GitHub
# release whose tag is `v<version>` (matching package.json) then builds and
# publishes that exact commit to npm. Nothing here pushes back to the repo.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'homebridge-plugins/homebridge-unifi-smartpower' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Check the release tag matches package.json
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs lint and build.
      - name: Publish to npm
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NPM_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}

  github-releases-to-discord:
    name: Discord Webhooks
    needs: publish
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "Unifi SmartPower Release"
      description: |
        Version `v${{ needs.publish.outputs.version }}`
      url: ${{ github.event.release.html_url }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_LATEST }}
